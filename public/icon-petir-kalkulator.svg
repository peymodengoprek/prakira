<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Ikon petir dengan kalkulator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bolt" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="calc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Petir -->
  <path d="M255 25 L120 215 L200 215 L160 375 L320 150 L240 150 L300 25 Z"
        fill="url(#bolt)" stroke="#1E3A8A" stroke-width="10" stroke-linejoin="round"/>
  <!-- Kilau -->
  <path d="M258 52 L148 205" stroke="#fff" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M268 38 L274 38" stroke="#fff" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Wajah -->
  <g>
    <ellipse cx="196" cy="172" rx="8" ry="11" fill="#1E3A8A"/>
    <ellipse cx="246" cy="172" rx="8" ry="11" fill="#1E3A8A"/>
    <circle cx="199" cy="168" r="3" fill="#fff"/>
    <circle cx="249" cy="168" r="3" fill="#fff"/>
    <ellipse cx="177" cy="192" rx="11" ry="6" fill="#93C5FD" opacity="0.8"/>
    <ellipse cx="265" cy="192" rx="11" ry="6" fill="#93C5FD" opacity="0.8"/>
    <path d="M208 190 Q221 208 234 190 Z" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M214 197 Q221 203 228 197 Q221 199 214 197 Z" fill="#93C5FD"/>
  </g>

  <!-- Kalkulator -->
  <g transform="translate(95 292) rotate(-12)">
    <rect x="-50" y="-65" width="100" height="130" rx="13" fill="url(#calc)" stroke="#1E3A8A" stroke-width="7" stroke-linejoin="round"/>
    <!-- Layar -->
    <rect x="-38" y="-52" width="76" height="28" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="4"/>
    <text x="30" y="-31" text-anchor="end" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#1E3A8A">0</text>
    <!-- Tombol -->
    <g fill="#BFDBFE" stroke="#1E3A8A" stroke-width="2.5">
      <rect x="-37" y="-14" width="16" height="14" rx="4"/>
      <rect x="-14" y="-14" width="16" height="14" rx="4"/>
      <rect x="9"   y="-14" width="16" height="14" rx="4"/>
      <rect x="-37" y="7"   width="16" height="14" rx="4"/>
      <rect x="-14" y="7"   width="16" height="14" rx="4"/>
      <rect x="9"   y="7"   width="16" height="14" rx="4"/>
      <rect x="-37" y="28"  width="16" height="14" rx="4"/>
      <rect x="-14" y="28"  width="16" height="14" rx="4"/>
      <rect x="9"   y="28"  width="16" height="14" rx="4"/>
    </g>
    <!-- Kolom operator -->
    <g fill="#60A5FA" stroke="#1E3A8A" stroke-width="2.5">
      <rect x="31" y="-14" width="10" height="14" rx="4"/>
      <rect x="31" y="7"   width="10" height="14" rx="4"/>
      <rect x="31" y="28"  width="10" height="14" rx="4"/>
    </g>
    <!-- Baris bawah -->
    <g fill="#BFDBFE" stroke="#1E3A8A" stroke-width="2.5">
      <rect x="-37" y="48" width="39" height="10" rx="4"/>
      <rect x="9"   y="48" width="16" height="10" rx="4"/>
    </g>
    <rect x="31" y="48" width="10" height="10" rx="4" fill="#60A5FA" stroke="#1E3A8A" stroke-width="2.5"/>
  </g>
</svg>
